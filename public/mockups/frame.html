<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Aperçu mobile</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 18px;
      background: #14161b;
    }
    iframe {
      width: 390px;
      height: 844px;
      border: 0;
      border-radius: 28px;
      background: #000;
      box-shadow: 0 24px 70px -24px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <iframe id="frame" src="http://localhost:3000/garage"></iframe>
  <script>
    const path = new URLSearchParams(location.search).get("path") || "/garage";
    document.getElementById("frame").src = "http://localhost:3000" + path;
  </script>
</body>
</html>
