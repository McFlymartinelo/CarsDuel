<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c10" />
    <title>Hors ligne — CarsDuel</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
        background-color: #07090d;
        background-image:
          radial-gradient(ellipse 75% 55% at 50% 40%, rgba(245, 158, 11, 0.14), transparent 70%),
          linear-gradient(180deg, rgba(7, 9, 13, 0.82), rgba(7, 9, 13, 0.96)),
          url("/backgrounds/pit-garage.webp");
        background-position: center;
        background-size: cover;
        color: #e4e6eb;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: min(28rem, 100%);
        border: 1px solid #27272a;
        border-radius: 1.25rem;
        background: rgba(16, 19, 26, 0.94);
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 24px 70px -28px rgba(0, 0, 0, 0.9);
      }
      img {
        width: 72px;
        height: 72px;
        filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.4));
      }
      .eyebrow {
        margin: 1rem 0 0;
        color: #f59e0b;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.9rem;
        line-height: 1;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      p {
        margin: 0.9rem 0 0;
        color: #a1a1aa;
        font-size: 0.9rem;
        line-height: 1.55;
      }
      .actions {
        margin-top: 1.6rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.6rem;
      }
      button,
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        border-radius: 0.75rem;
        padding: 0 1.1rem;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
      }
      button {
        border: 0;
        background: linear-gradient(#fbbf24, #f59e0b);
        color: #0a0c10;
      }
      a {
        border: 1px solid #3f3f46;
        color: #e4e6eb;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #f59e0b;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: rise 0.35s ease-out both;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.webp" alt="CarsDuel" />
      <p class="eyebrow">Connexion perdue</p>
      <h1>Hors ligne</h1>
      <p>
        Le réseau est indisponible. Vos données sont en sécurité : dès que la connexion revient,
        vous retrouvez votre garage et vos duels.
      </p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Réessayer</button>
        <a href="/garage">Ouvrir le garage</a>
      </div>
    </main>
  </body>
</html>
