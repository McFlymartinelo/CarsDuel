name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carsduel
          POSTGRES_PASSWORD: carsduel
          POSTGRES_DB: carsduel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carsduel -d carsduel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://carsduel:carsduel@localhost:5432/carsduel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run db:setup
      - run: npm test
      - run: npm run build
